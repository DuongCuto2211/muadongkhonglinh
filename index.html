<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thư mời</title>
<meta name="theme-color" content="#0b2a4a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="locked">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.6-8 11-8 11z"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.3l7.1-.7z"/></symbol>
<symbol id="shell" viewBox="0 0 24 24"><path d="M12 3C7 3 3 8 3 14c0 3 2 5 4 6h10c2-1 4-3 4-6 0-6-4-11-9-11zM12 3v17M8 5l2 15M16 5l-2 15M5.500 9l4.500 11M18.500 9L14 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M12 22s7-6.500 7-12a7 7 0 0 0-14 0c0 5.500 7 12 7 12zm0-9a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" fill-rule="evenodd"/></symbol>
<symbol id="wave" viewBox="0 0 120 12"><path d="M0 6q10-8 20 0t20 0 20 0 20 0 20 0 20 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</defs></svg>

<section id="intro" class="intro" aria-label="Phong bì thư">
  <p id="introHint" class="hint hand"></p>
  <div id="env" class="env">
    <div class="env-back"></div>
    <div class="env-letter"><svg class="ic" aria-hidden="true"><use href="#shell"/></svg></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <svg class="ic seal" aria-hidden="true"><use href="#heart"/></svg>
  </div>
  <button id="openBtn" class="btn" type="button">MỞ THƯ</button>
</section>

<main id="main" hidden>
  <button id="musicBtn" class="music" type="button" aria-label="Bật hoặc tắt nhạc nền" aria-pressed="false"><span class="bars"><i></i><i></i><i></i></span></button>

  <section id="letter" class="sec reveal">
    <article class="paper">
      <i class="tape"></i>
      <svg class="ic doodle" style="top:14px;right:18px;font-size:30px" aria-hidden="true"><use href="#star"/></svg>
      <svg class="ic doodle" style="bottom:72px;left:14px;font-size:30px;animation-delay:-2s" aria-hidden="true"><use href="#shell"/></svg>
      <h1 id="invTitle"></h1>
      <svg class="wave" aria-hidden="true"><use href="#wave"/></svg>
      <div id="invBody"></div>
      <p id="invSign" class="sign hand"></p>
    </article>
  </section>

  <section id="event" class="sec reveal">
    <article class="paper">
      <i class="tape"></i>
      <h2>Ghi lại nhé</h2>
      <svg class="wave" aria-hidden="true"><use href="#wave"/></svg>
      <div class="date"><b id="evDay"></b><div><strong id="evMonth"></strong><br><span id="evWeek" class="cap"></span></div></div>
      <p class="row"><svg class="ic" aria-hidden="true"><use href="#clock"/></svg><span id="evTime"></span></p>
      <p class="row"><svg class="ic" aria-hidden="true"><use href="#pin"/></svg><span id="evPlace"></span></p>
      <p class="row"><span class="ph" aria-hidden="true">☎</span><a id="evPhone" href="#"></a></p>
      <div id="countdown" class="cd" aria-live="off">
        <div><b id="cdD">0</b><small>ngày</small></div><div><b id="cdH">00</b><small>giờ</small></div>
        <div><b id="cdM">00</b><small>phút</small></div><div><b id="cdS">00</b><small>giây</small></div>
      </div>
      <p id="evNote" class="note hand"></p>
      <a id="mapBtn" class="btn" href="#" target="_blank" rel="noopener">XEM BẢN ĐỒ</a>
    </article>
  </section>

  <section id="album" class="sec reveal">
    <h2 class="light">Album kỷ niệm</h2>
    <svg class="wave" aria-hidden="true"><use href="#wave"/></svg>
    <div id="gallery" class="gallery"></div>
  </section>

  <section id="guestbook" class="sec reveal">
    <article class="paper">
      <i class="tape"></i>
      <h2>Sổ lưu bút</h2>
      <svg class="wave" aria-hidden="true"><use href="#wave"/></svg>
      <form id="gbForm" novalidate>
        <div class="field"><label for="gbName">Tên của bạn</label><input id="gbName" maxlength="40" autocomplete="nickname" required></div>
        <div class="field"><label for="gbMsg">Lời nhắn</label><textarea id="gbMsg" rows="4" maxlength="300" required></textarea><small id="gbCount">0/300</small></div>
        <input id="gbWebsite" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button id="gbBtn" class="btn" type="submit">Gửi lời nhắn</button>
        <p id="gbStatus" class="status" role="status" aria-live="polite"></p>
      </form>
      <ul id="gbList" class="gb-list"></ul>
    </article>
  </section>

  <section id="thanks" class="sec thanks reveal">
    <div class="hearts" aria-hidden="true"><svg class="ic doodle"><use href="#heart"/></svg><svg class="ic doodle" style="animation-delay:-1s"><use href="#star"/></svg><svg class="ic doodle" style="animation-delay:-2s"><use href="#heart"/></svg></div>
    <h2 id="thTitle" class="light"></h2>
    <div id="thLines"></div>
    <p id="thHand" class="hand big"></p>
  </section>
</main>

<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Xem ảnh">
  <button id="lbClose" class="lb-close" type="button" aria-label="Đóng ảnh">×</button>
  <img id="lbImg" alt=""><p id="lbCap" class="hand"></p>
</div>
<div id="toast" class="toast" role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="script.js"></script>
</body>
</html>
